<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-dalang Cloud (Hugging Face)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffb74d;
            margin-bottom: 5px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }
        .main-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-container {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1024px;
            text-align: center;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #4caf50; color: white; }
        .btn-primary:hover { background-color: #43a047; }
        .btn-danger { background-color: #f44336; color: white; }
        .btn-danger:hover { background-color: #e53935; }
        .btn-action { background-color: #2196f3; color: white; }
        .btn-action:hover { background-color: #1e88e5; }
        
        .logs-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 380px;
            overflow-y: scroll;
            font-family: monospace;
            font-size: 13px;
            color: #a5d6a7;
            white-space: pre-wrap;
        }
        .panel-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
        }
        .panel-card h3 {
            margin-top: 0;
            color: #ffb74d;
        }
    </style>
</head>
<body>
    <h1>🎭 e-dalang Cloud (Hugging Face)</h1>
    <p>Menjalankan program Bima & Arjuna 24/7 di Cloud tanpa VPS.</p>

    <div class="container">
        <div class="main-panel">
            <div class="video-container">
                <img id="videoStream" src="/video_feed" alt="e-dalang Stream">
            </div>
            <div class="controls">
                <button class="btn-primary" onclick="startApp()">Start App</button>
                <button class="btn-danger" onclick="stopApp()">Stop App</button>
                <button class="btn-action" onclick="sendKey('space')">SPACE (Lanjut)</button>
                <button class="btn-action" onclick="sendKey('p')">P (Projector)</button>
                <button class="btn-action" onclick="sendKey('f11')">F11 (Fullscreen)</button>
                <button class="btn-action" onclick="sendKey('esc')">ESC (Keluar)</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-card">
                <h3>Panduan Kontrol</h3>
                <ul>
                    <li><b>Start/Stop</b>: Mengontrol proses game.</li>
                    <li><b>SPACE</b>: Lanjut cerita.</li>
                    <li><b>P</b>: Mode projector.</li>
                </ul>
            </div>
            <div class="panel-card">
                <h3>Terminal Logs</h3>
                <div id="logs" class="logs-box">Menunggu log...</div>
            </div>
        </div>
    </div>

    <script>
        function startApp() {
            fetch('/start', {method: 'POST'})
                .then(res => res.json())
                .then(data => alert(data.message));
        }

        function stopApp() {
            fetch('/stop', {method: 'POST'})
                .then(res => res.json())
                .then(data => alert(data.message));
        }

        function sendKey(key) {
            fetch('/press/' + key, {method: 'POST'})
                .then(res => res.json())
                .catch(err => console.error(err));
        }

        setInterval(() => {
            fetch('/logs')
                .then(res => res.json())
                .then(data => {
                    const logBox = document.getElementById('logs');
                    logBox.textContent = data.logs.join('');
                    logBox.scrollTop = logBox.scrollHeight;
                });
        }, 2000);
    </script>
</body>
</html>
